# CI — universal quality gate (governance template).
#
# ci-template-version: 5
#
# PROPRIEDADE: este ficheiro e do template. Nao se edita a mao num repo
# consumidor — o `/sync-repos` sobrepoe-no. Jobs proprios de um repo (um teste
# de mutacao, um drift de deploy, um relatorio) vivem num ficheiro de workflow
# SEPARADO, que o sync nunca toca. Ai vale a pena usar `on: pull_request: paths:`
# nativo: quando os caminhos nao batem, o GitHub nem agenda runner — custo zero.
#
# Porque existe o marcador de versao acima: ate 2026-09-22 o sync verificava se
# o ci.yml *continha* governance-check, detect-ci-mode, audit e gitleaks. Um
# ficheiro duas versoes atrasado contem tudo isso na mesma. O icon-site levou a
# etiqueta «v3.1» a 07/09, a v3.1 real so existiu a 09/09, e ninguem deu por
# isso durante duas semanas — ate os minutos de Actions da org acabarem.
#
# Auto-detecta o stack: cada job só age se os ficheiros relevantes existirem,
# por isso é SEGURO em qualquer repo — num repo só de docs/dados os jobs
# concluem verdes sem fazer nada; num webapp correm a sério.
#
#   build-test : corre se houver package.json. Detecta Bun antes de npm para
#                evitar package-locks stale em repos Lovable. Instala deps,
#                corre lint/build/test se existirem e bloqueia audit high/critical.
#   deno-check : corre se houver edge functions Deno (supabase/functions/*/index.ts),
#                que ficam FORA do tsconfig do frontend — build/lint não as veem.
#                Tolerante a falhas de rede do CDN (esm.sh/deno.land): avisa,
#                não falha; só falha em erro real de código.
#   python-test: corre em projectos Python explícitos. O contrato suportado é
#                requirements.txt com pytest declarado; compila toda a sintaxe
#                Python e executa a suite existente em tests/ sem aceitar zero testes.
#   gitleaks   : corre SEMPRE, em todos os repos. Scan da história completa
#                (não só do diff) — é a rede de segurança do lado do servidor
#                para repos onde algo (ex: Lovable) comita direto a `main`
#                sem passar pelo pre-commit hook local (.githooks/pre-commit).
#                Falha o build se encontrar um segredo real.
#   governance-check : valida a estrutura em todos os runs. Em pull requests,
#                alterações a artefactos rastreados (incluindo docs/decisions)
#                exigem actualizações tanto no INDEX.md como no CHANGELOG.md.
#   template-tests : no template original, valida os quatro perfis e executa
#                mini-projectos reais npm, Bun e Deno. Após aplicar um perfil,
#                tests/template é removido e este job termina como skip seguro.
#
# Editar/adicionar este ficheiro exige o scope 'workflow' no token git.
# Em repos de org cujo token não o tem → adicionar via editor web do GitHub.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Corre primeiro e sozinho, só para responder "o que existe neste repo?".
  # Sem ele, cada verificação pesada ligava a sua própria máquina, descarregava
  # tudo, e só então descobria que não tinha nada para fazer — o arranque
  # paga-se na mesma. Um arranque em vez de três.
  detect:
    # Só em pull request: as verificações que dependem dele também só
    # correm aí. Em push a main, nada disto arranca — fica só o gitleaks.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.d.outputs.node }}
      deno: ${{ steps.d.outputs.deno }}
      python: ${{ steps.d.outputs.python }}
      python_supported: ${{ steps.d.outputs.python_supported }}
      template: ${{ steps.d.outputs.template }}
      touched_code: ${{ steps.p.outputs.touched_code }}
      touched_deno: ${{ steps.p.outputs.touched_deno }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - id: d
        run: node scripts/detect-ci-mode.mjs --github-output >> "$GITHUB_OUTPUT"
      # O `detect` diz o que EXISTE no repo. Isto diz o que MUDOU no PR — que e
      # outra pergunta, e a que faltava: metade do trabalho destes repos e
      # conteudo e documentacao, e um .md nao parte um build.
      #
      # Na duvida, corre tudo. Se o intervalo de diff nao for calculavel, ou se
      # o proprio workflow mudar, as duas saidas ficam `true`. Testar a mais
      # custa minutos; testar a menos custa um bug em producao.
      - id: p
        shell: bash
        run: |
          tudo() { printf 'touched_code=true\ntouched_deno=true\n' >> "$GITHUB_OUTPUT"; exit 0; }
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null || tudo
          CHANGED=$(git diff --name-only "$BASE...HEAD") || tudo
          echo "Alterado:"; echo "$CHANGED" | sed 's/^/  /'

          echo "$CHANGED" | grep -qE '^\.github/workflows/' && tudo

          CODE='^(src/|lib/|app/|public/|scripts/|tests/|index\.html|package\.json|package-lock\.json|bun\.lockb|requirements\.txt|pyproject\.toml|vite\.config\.|tsconfig|tailwind\.config\.|postcss\.config\.|eslint\.config\.|supabase/migrations/)'
          # Extensao obrigatoria: ha documentacao a viver dentro de
          # supabase/functions/ (ex. DEPLOY_LEDGER.md), e um .md nao precisa de
          # `deno check`. Apanhado a testar este filtro contra commits reais.
          DENO='^supabase/functions/.*\.(ts|js|mjs|json|jsonc)$'

          echo "$CHANGED" | grep -qE "$CODE" && echo "touched_code=true" >> "$GITHUB_OUTPUT" || echo "touched_code=false" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" | grep -qE "$DENO" && echo "touched_deno=true" >> "$GITHUB_OUTPUT" || echo "touched_deno=false" >> "$GITHUB_OUTPUT"

  build-test:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.node != 'false' && needs.detect.outputs.touched_code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - id: detect
        run: |
          node scripts/detect-ci-mode.mjs --github-output >> "$GITHUB_OUTPUT"
      - name: Setup Node with npm cache
        if: steps.detect.outputs.package_manager == 'npm' && steps.detect.outputs.npm_lock == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Setup Node without cache
        if: steps.detect.outputs.package_manager == 'npm' && steps.detect.outputs.npm_lock != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Setup Bun
        if: steps.detect.outputs.package_manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install npm dependencies
        if: steps.detect.outputs.package_manager == 'npm'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package.json exists without package-lock.json; install is non-deterministic"
            npm install --no-audit --no-fund --package-lock=false
          fi
      - name: Install Bun dependencies
        if: steps.detect.outputs.package_manager == 'bun'
        run: bun install --frozen-lockfile
      - if: steps.detect.outputs.node == 'true'
        run: |
          if [ "${{ steps.detect.outputs.package_manager }}" = "bun" ]; then bun run --if-present lint; else npm run lint --if-present; fi
      # Os bundlers transpilam sem verificar tipos: um acesso a campo inexistente
      # passa verde e so rebenta em producao. Onde ha tsconfig, o typecheck e
      # obrigatorio — e se o script faltar, isso e dito em voz alta em vez de
      # passar calado, que e a diferenca entre este passo e o `test --if-present`
      # que saiu nesta mesma alteracao.
      # v5: o passo de testes tinha sido REMOVIDO na v4, por eu ter verificado
      # que o icon-site nao tinha script `test` e ter generalizado a partir de um
      # repo so. O lusiberiastays2 tem — `test`, `test:watch`, `test:coverage` —
      # e a v4 teria deixado de lhe correr os testes de frontend, em silencio.
      # Volta na forma honesta: corre quando existe, e diz quando nao existe.
      # A diferenca para o `--if-present` e que a ausencia deixa de ser sucesso.
      - name: Testes (onde houver script `test`)
        if: steps.detect.outputs.node == 'true'
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.test?0:1)"; then
            if [ "${{ steps.detect.outputs.package_manager }}" = "bun" ]; then bun run test; else npm run test; fi
          else
            echo "::notice::Sem script \`test\` no package.json — nada a correr. Se este repo tem testes, declarar o script para o CI os executar."
          fi
      - name: Type-check (onde houver TypeScript)
        if: steps.detect.outputs.node == 'true'
        run: |
          if ! ls tsconfig*.json >/dev/null 2>&1; then
            echo "sem tsconfig — nada a verificar"; exit 0
          fi
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.typecheck?0:1)"; then
            if [ "${{ steps.detect.outputs.package_manager }}" = "bun" ]; then bun run typecheck; else npm run typecheck; fi
          else
            echo "::warning::Ha tsconfig mas nao ha script \`typecheck\` no package.json — o build transpila sem verificar tipos e nada no CI o faz. Acrescentar \"typecheck\": \"tsc --noEmit\"."
          fi
      - if: steps.detect.outputs.node == 'true'
        run: |
          if [ "${{ steps.detect.outputs.package_manager }}" = "bun" ]; then bun run --if-present build; else npm run build --if-present; fi
      - name: npm dependency audit (block high/critical)
        if: steps.detect.outputs.package_manager == 'npm' && steps.detect.outputs.npm_lock == 'true'
        run: npm audit --audit-level=high
      - name: Bun dependency audit (block high/critical)
        if: steps.detect.outputs.package_manager == 'bun'
        run: bun audit --audit-level=high

  python-test:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.python != 'false' && needs.detect.outputs.touched_code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Reject unsupported Python setup
        if: needs.detect.outputs.python_supported != 'true'
        run: |
          echo "::error::Unsupported Python CI setup. Add a root requirements.txt with an active pytest requirement, or adapt ci.yml explicitly for this project's runner."
          exit 1
      - name: Setup Python
        if: needs.detect.outputs.python_supported == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        if: needs.detect.outputs.python_supported == 'true'
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax and run existing pytest suite
        if: needs.detect.outputs.python_supported == 'true'
        run: python scripts/run-python-ci.py

  # NÃO ganha portão de evento: corre em pull request E em push a main.
  # É a rede de segurança do lado do servidor para os repos onde o Lovable
  # comita directamente a main, sem passar pelo hook local. Restringi-lo a
  # pull request deixaria esses commits sem qualquer varrimento de segredos.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Download and verify gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}" -o "${GITLEAKS_ARCHIVE}"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o gitleaks_checksums.txt
          grep "${GITLEAKS_ARCHIVE}" gitleaks_checksums.txt | sha256sum -c -
          tar -xzf "${GITLEAKS_ARCHIVE}" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" detect --no-banner --redact --verbose

  deno-check:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.deno != 'false' && needs.detect.outputs.touched_deno != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - id: detect
        run: |
          node scripts/detect-ci-mode.mjs --github-output >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.deno == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - if: steps.detect.outputs.deno == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/deno
          key: deno-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: deno-
      - name: Type-check all edge functions
        if: steps.detect.outputs.deno == 'true'
        working-directory: supabase/functions
        run: |
          real_fail=0
          for f in */index.ts; do
            ok=0
            for attempt in 1 2 3; do
              if out=$(deno check --node-modules-dir=auto --no-lock "$f" 2>&1); then ok=1; break; fi
              if echo "$out" | grep -qiE "failed: 5[0-9][0-9]|unknown status code|timed out|connection (closed|reset|refused)"; then
                echo "::warning::$f: erro de rede a obter dependencias (tentativa $attempt)"
                sleep 10
                continue
              fi
              echo "$out"
              real_fail=1
              break
            done
            if [ $ok -eq 0 ] && [ $real_fail -eq 0 ]; then
              echo "::warning::$f: ignorado apos falhas de rede (CDN indisponivel, nao e erro de codigo)"
            fi
          done
          exit $real_fail

  template-tests:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.template != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Setup Python for offline executable fixture
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Setup Bun for executable fixture
        if: hashFiles('tests/template/fixtures/bun/package.json') != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Setup Deno for executable fixture
        if: hashFiles('tests/template/fixtures/deno/supabase/functions/*/index.ts') != ''
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Test template scaffolding and CI detection
        run: |
          if [ -d tests/template ]; then
            node scripts/check-governance.mjs --template
            node --test tests/template/*.test.mjs
            python -m unittest tests/template/python_ci_helper_test.py
            node tests/template/run-ci-fixtures.mjs
          else
            echo "Template fixture tests removed by applied project profile; skipping."
          fi

  # Gate de governance: valida a estrutura em todos os runs. Num PR que
  # adiciona/altera artefactos rastreados, exige INDEX.md e CHANGELOG.md. Se nenhum
  # caminho de artefacto existir no repo, o grep nao casa e o job conclui verde.
  # A validacao estrutural corre sempre; a comparacao de ficheiros alterados so
  # corre em pull_request, porque push a main nao tem contexto de PR.
  # Motivacao: um PR pode shippar artefactos (ex. videos, edge fns, decisoes) e
  # nunca tocar no INDEX -> drift silencioso entre o repo e o seu mapa.
  governance-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Validate governance structure
        run: node scripts/check-governance.mjs
      - name: INDEX e CHANGELOG devem acompanhar mudancas de artefactos
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          ART='^(public/videos/|supabase/functions/|supabase/migrations/|stakeholders/|pitches/|research/|decisions/|docs/decisions/|meetings/)'
          if echo "$CHANGED" | grep -qE "$ART"; then
            missing=0
            for required in INDEX.md CHANGELOG.md; do
              if ! echo "$CHANGED" | grep -qx "$required"; then
                echo "::error::PR toca artefactos rastreados sem actualizar $required."
                missing=1
              fi
            done
            echo "Artefactos alterados:"
            echo "$CHANGED" | grep -E "$ART" | sed 's/^/  - /'
            exit "$missing"
          fi
